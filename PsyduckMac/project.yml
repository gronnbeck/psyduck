name: Psyduck
options:
  bundleIdPrefix: lol.np
  deploymentTarget:
    macOS: "14.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.5"
targets:
  Psyduck:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      # Bricolage Grotesque and JetBrains Mono, both OFL — the np.lol design
      # system's two faces.
      - path: Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: Sparkle
    info:
      path: Sources/Info.plist
      properties:
        ATSApplicationFontsPath: Fonts/
        CFBundleDisplayName: Psyduck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "MIT licensed. https://github.com/gronnbeck/psyduck"

        # Sparkle. The feed lives beside the .zip in the nplol dist bucket,
        # whose name is a 1Password secret, so CI stamps the real URL in at
        # build time (see .github/workflows/macos-release.yml). Empty here,
        # which the app reads as "updates not configured" and disables the
        # check — the right behaviour for a local dev build.
        SUFeedURL: ""
        # psyduck's own EdDSA public key. The private half lives only at
        # op://nplol/psyduck/sparkle-private-key and in the login keychain of
        # the gronnbeck Mac (account `psyduck`). Installed copies trust only
        # this key's signature, so losing the private key strands them.
        SUPublicEDKey: "8PEYnR8e9WIGCUUADEYCUbiMg74qJQMLd4nV22tmRSE="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.np.psyduck
        PRODUCT_NAME: Psyduck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # The version people see; bump it by hand per release. CI uses the run
        # number as CURRENT_PROJECT_VERSION, which is what Sparkle compares.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "0"
        # No App Sandbox: psyduck runs git and claude against arbitrary
        # directories, and isn't App Store bound.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        # Ad-hoc for local builds. CI re-signs the whole bundle from the inside
        # out with the Developer ID certificate before notarizing.
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: NO
  PsyduckTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tests
    dependencies:
      - target: Psyduck
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Psyduck:
    build:
      targets:
        Psyduck: all
        PsyduckTests: [ test ]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PsyduckTests
